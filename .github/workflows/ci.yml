name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]   # vitest 5 needs Node 22.12+
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build to static files
        run: npm run build
      - name: Built index.html exists and uses relative asset URLs
        run: |
          test -f dist/index.html
          ! grep -E '(src|href)="/' dist/index.html
      - name: Bundle size budget (60 kB gzip JS, 2 kB gzip CSS)
        run: |
          test "$(cat dist/assets/*.js | gzip -c | wc -c)" -le 60000
          test "$(cat dist/assets/*.css | gzip -c | wc -c)" -le 2000
      - run: npm audit --audit-level=high --omit=dev

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: dpdpkit-dev/dpdpkit-fastapi
          path: _fastapi
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Backend
        run: |
          uv venv _venv
          uv pip install --python _venv "dpdpkit-policies @ git+https://github.com/dpdpkit-dev/dpdpkit-policies@main" "dpdpkit-core @ git+https://github.com/dpdpkit-dev/dpdpkit-core@main" ./_fastapi uvicorn
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every screen against the real backend, with accessibility checks (Playwright)
        run: npm run e2e
        env:
          DPDPKIT_FASTAPI_DIR: _fastapi
          DPDPKIT_PYTHON: ${{ github.workspace }}/_venv/bin/python
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
